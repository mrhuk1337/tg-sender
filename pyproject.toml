[project]
name = "tg-sender"
version = "0.1.0"
description = "Telegram bulk personal message sender"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "better-proxy>=1.3.1",
    "jinja2>=3.1.5",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "phonenumbers>=8.13.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pysocks>=1.7.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "telethon>=1.45.0",
    "tgconvertor[tdata]>=0.3.0",
    "typer>=0.27.2",
]

[project.scripts]
tg-sender = "tg_sender.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
]
ignore = [
    "B008",
    "E501",
]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src"]
pythonVersion = "3.14"
reportExplicitAny = false
reportAny = false

